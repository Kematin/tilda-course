# Временный HTTP-only virtual host для первого выпуска сертификата Certbot.
# После выпуска замените его на coolaf.online.conf.

server {
    listen 80;
    listen [::]:80;
    server_name coolaf.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 200 "coolaf.online: certificate bootstrap\n";
        add_header Content-Type text/plain;
    }
}
