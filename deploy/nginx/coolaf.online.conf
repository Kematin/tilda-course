# Готовый virtual host для системного Nginx.
# Если HTTPS для домена уже настроен, перенесите только location / в существующий server block.

server {
    listen 80;
    listen [::]:80;
    server_name coolaf.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coolaf.online;

    # Стандартные пути Certbot. Замените их, если сертификаты лежат в другом месте.
    ssl_certificate /etc/letsencrypt/live/coolaf.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolaf.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        # Не складываем большие видеоответы во временные файлы Nginx.
        proxy_buffering off;
        proxy_force_ranges on;
        proxy_read_timeout 1h;
        send_timeout 1h;
    }
}
