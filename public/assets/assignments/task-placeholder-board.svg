<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Пример доски для практического задания</title>
  <desc id="description">Мягкий декоративный макет с карточками, цветами и заметками.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e8ed"/>
      <stop offset="1" stop-color="#e4eee7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#664551" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="52" fill="url(#background)"/>
  <circle cx="1050" cy="105" r="120" fill="#efcbd5" opacity=".7"/>
  <circle cx="110" cy="790" r="150" fill="#cddfd2" opacity=".72"/>
  <g filter="url(#shadow)">
    <rect x="110" y="105" width="980" height="690" rx="36" fill="#fffdfa"/>
    <rect x="170" y="170" width="355" height="255" rx="24" fill="#d9a3b2"/>
    <rect x="555" y="170" width="475" height="118" rx="20" fill="#f5e8df"/>
    <rect x="555" y="312" width="475" height="113" rx="20" fill="#dce9df"/>
    <rect x="170" y="465" width="265" height="264" rx="24" fill="#f4ddd5"/>
    <rect x="465" y="465" width="265" height="264" rx="24" fill="#dce6eb"/>
    <rect x="760" y="465" width="270" height="264" rx="24" fill="#eee3c9"/>
  </g>
  <g fill="#765d69" opacity=".76">
    <rect x="600" y="207" width="310" height="14" rx="7"/>
    <rect x="600" y="238" width="185" height="10" rx="5" opacity=".55"/>
    <rect x="600" y="350" width="260" height="14" rx="7"/>
    <rect x="600" y="381" width="340" height="10" rx="5" opacity=".55"/>
  </g>
  <text x="210" y="330" fill="#fff" font-family="Arial, sans-serif" font-size="40" font-weight="700">Твоя идея</text>
  <text x="600" y="790" fill="#785966" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Замени этот файл своим изображением</text>
</svg>
