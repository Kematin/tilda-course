<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Пример структуры страницы</title>
  <desc id="description">Схематичный макет сайта с заголовком, карточками и кнопками.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e5eee7"/>
      <stop offset="1" stop-color="#faedf1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4a3d44" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="52" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <rect x="155" y="80" width="890" height="740" rx="34" fill="#fffdfa"/>
  </g>
  <rect x="205" y="130" width="790" height="62" rx="18" fill="#f2e5e8"/>
  <circle cx="245" cy="161" r="15" fill="#ae6378"/>
  <rect x="285" y="151" width="170" height="20" rx="10" fill="#796c75"/>
  <rect x="775" y="151" width="62" height="20" rx="10" fill="#a99ca4"/>
  <rect x="858" y="151" width="62" height="20" rx="10" fill="#a99ca4"/>
  <rect x="205" y="225" width="790" height="240" rx="24" fill="#f7ece7"/>
  <rect x="255" y="278" width="330" height="29" rx="14" fill="#7f5b69"/>
  <rect x="255" y="327" width="260" height="15" rx="7" fill="#ad9da4"/>
  <rect x="255" y="358" width="300" height="15" rx="7" fill="#ad9da4"/>
  <rect x="255" y="399" width="134" height="38" rx="19" fill="#ad6077"/>
  <circle cx="825" cy="345" r="84" fill="#d6e3d9"/>
  <g>
    <rect x="205" y="495" width="245" height="220" rx="22" fill="#f2dce3"/>
    <rect x="475" y="495" width="245" height="220" rx="22" fill="#dce8df"/>
    <rect x="750" y="495" width="245" height="220" rx="22" fill="#eee5d1"/>
  </g>
  <text x="600" y="775" fill="#785966" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">Добавь сюда свой макет</text>
</svg>
