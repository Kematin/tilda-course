<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Пример заметок к практическому заданию</title>
  <desc id="description">Список задач и цветные заметки на мягком фоне.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5e5e9"/>
      <stop offset="1" stop-color="#e5ece0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4f3d46" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="52" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <rect x="125" y="90" width="610" height="720" rx="32" fill="#fffdfa"/>
    <rect x="770" y="145" width="300" height="245" rx="28" fill="#efccd6" transform="rotate(4 920 267)"/>
    <rect x="765" y="485" width="310" height="230" rx="28" fill="#d5e4d9" transform="rotate(-3 920 600)"/>
  </g>
  <text x="190" y="180" fill="#654b56" font-family="Arial, sans-serif" font-size="42" font-weight="700">Чек-лист</text>
  <g font-family="Arial, sans-serif" font-size="25" fill="#776b72">
    <circle cx="205" cy="270" r="20" fill="#d9a0b0"/><path d="m195 270 8 8 15-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="279">Проверь главную мысль</text>
    <circle cx="205" cy="355" r="20" fill="#d9a0b0"/><path d="m195 355 8 8 15-18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="364">Собери референсы</text>
    <circle cx="205" cy="440" r="20" fill="#d9a0b0"/><text x="250" y="449">Сделай первый вариант</text>
    <circle cx="205" cy="525" r="20" fill="none" stroke="#c5b9bf" stroke-width="4"/><text x="250" y="534">Посмотри свежим взглядом</text>
    <circle cx="205" cy="610" r="20" fill="none" stroke="#c5b9bf" stroke-width="4"/><text x="250" y="619">Подготовь результат</text>
  </g>
  <text x="920" y="250" fill="#8a5767" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Не спеши</text>
  <text x="920" y="300" fill="#8a6571" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Шаг за шагом</text>
  <text x="920" y="585" fill="#587061" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">У тебя</text>
  <text x="920" y="630" fill="#587061" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">получится ♡</text>
</svg>
